<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swalath Counter</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <h1>📿 Swalath Counter</h1>
  <div class="card center">
    <div class="big-count" id="total">0</div>
    <button onclick="addSwalath(1)">➕ Add Swalath</button>
    <br><br>
    <div class="btn-row">
      <button class="secondary" onclick="addSwalath(10)">+10</button>
      <button class="secondary" onclick="addSwalath(33)">+33</button>
      <button class="secondary" onclick="addSwalath(100)">+100</button>
    </div>
    <div style="margin-top:16px; width:100%; text-align:left; display: flex;">
      <input id="customAmount" type="number" min="1" placeholder="Custom count" />
      <button style="margin-left:20px; margin-bottom:14px;" onclick="addCustomCount()">Add Count</button>
    </div>
  </div>

  <div class="card">
    <h2>History (last 30 days)</h2>
    <div id="history"></div>
  </div>

  <button class="secondary" onclick="location.href='/dashboard.html'">← Back to Home</button>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<footer class="site-footer"><span class="skssf-label">SKSSF</span>Cheeral Unit Committee</footer>

<div class="help-contact small center" style="margin-top:8px;">
  <a href="https://wa.me/+918606490401" target="_blank" rel="noopener">Contact for help: WhatsApp</a>
</div>

<script>
const user = JSON.parse(localStorage.getItem('quiz_user') || 'null');
if (!user) window.location.href = '/index.html';

function loadData() {
  fetch('/api/swalath/' + user.id).then(r => r.json()).then(d => {
    document.getElementById('total').textContent = d.total;
    const hist = document.getElementById('history');
    if (!d.history.length) { hist.innerHTML = '<p class="small">No history yet.</p>'; return; }
    hist.innerHTML = d.history.map(h => `<div class="history-row"><span>${h.day}</span><span>${h.total}</span></div>`).join('');
  });
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('visible');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => toast.classList.remove('visible'), 3200);
}

function addSwalath(amount) {
  fetch('/api/swalath/' + user.id + '/add', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ amount })
  }).then(async r => {
    const d = await r.json();
    if (!r.ok) {
      showToast(d.error || 'Failed to add count');
      return;
    }
    document.getElementById('total').textContent = d.total;
    loadData();
  }).catch(() => {
    showToast('Network error. Try again.');
  });
}

function addCustomCount() {
  const input = document.getElementById('customAmount');
  const amount = Number(input.value) || 0;
  if (amount < 1) {
    showToast('Enter a valid count of 1 or more.');
    return;
  }
  if (amount > 10000) {
    showToast("You can't add above 10000 a day");
    return;
  }
  addSwalath(amount);
  input.value = '';
}

loadData();
</script>
</body>
</html>
