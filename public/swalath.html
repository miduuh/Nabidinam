<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swalath Campaign</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <h1>📿 Swalath Campaign</h1>

  <div class="card center">
    <h2>Campaign Ended</h2>
    <p class="small" style="margin: 0 0 12px; line-height: 1.6;">
      Thank you for participating in the Swalath campaign. The counting phase has now ended.
      We appreciate your contribution and support.
    </p>
  </div>

  <div class="card">
    <h2>Swalath Leaderboard</h2>
    <div id="leaderboard"></div>
  </div>

  <button class="secondary" onclick="location.href='/dashboard.html'">← Back to Home</button>
</div>

<footer class="site-footer"><span class="skssf-label">SKSSF</span>Cheeral Unit Committee</footer>

<div class="help-contact small center" style="margin-top:8px;">
  <a href="https://wa.me/+918606490401" target="_blank" rel="noopener">Contact for help: WhatsApp</a>
</div>

<script>
function loadLeaderboard() {
  fetch('/api/swalath/leaderboard')
    .then(r => r.json())
    .then(data => {
      const leaderboard = data.leaderboard || [];
      const el = document.getElementById('leaderboard');
      el.innerHTML = leaderboard.length
        ? leaderboard.map(row => `
            <div class="leaderboard-row">
              <span>#${row.rank} ${row.name}</span>
              <span>${row.total_count}</span>
            </div>
          `).join('')
        : '<p class="small">No Swalath counts yet.</p>';
    })
    .catch(() => {
      document.getElementById('leaderboard').innerHTML = '<p class="small">Unable to load leaderboard right now.</p>';
    });
}

loadLeaderboard();
</script>
</body>
</html>
