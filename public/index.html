<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meelad Program - Register</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <h1>
    🌙 Thajdaree Madina 2026<br>
    <small style="font-size: 0.32em; font-weight: 500; letter-spacing: 1px;">Learn • Compete • Celebrate</small>
  </h1>

  <div class="card">
    <h2>Register / Login</h2>

    <input id="name" placeholder="Full Name">

    <input
      id="phone"
      placeholder="Phone Number"
      type="tel"
      inputmode="numeric"
    >

    <button onclick="register()">Log In</button>

    <p id="msg" class="small center"></p>
  </div>
</div>
<footer class="site-footer"><span class="skssf-label">SKSSF</span>Pazhupathoor Unit Committee</footer>

<div class="help-contact small center" style="margin-top:8px;">
  <a href="https://wa.me/+917902644921" target="_blank" rel="noopener">Contact for help: WhatsApp</a>
</div>
<script>
const savedUser = localStorage.getItem('quiz_user');
if (savedUser) {
  fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ phone: JSON.parse(savedUser).phone })
  }).then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      localStorage.setItem('quiz_user', JSON.stringify(data.user));
      window.location.href = '/dashboard.html';
    }).catch(() => { /* stay on registration page */ });
}

function register() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const msg = document.getElementById('msg');
  if (!name || !phone) { msg.textContent = 'Please fill all fields'; return; }

  fetch('/api/register', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name, phone })
  }).then(r => r.json()).then(data => {
    if (data.error) { msg.textContent = data.error; return; }
    localStorage.setItem('quiz_user', JSON.stringify(data.user));
    window.location.href = '/dashboard.html';
  });
}
</script>
</body>
</html>
