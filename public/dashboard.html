<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <h1 id="welcome">Welcome!</h1>
  <div class="card center">
    <p>Choose a section:</p>
    <button id="liveQuizBtn" onclick="location.href='/quiz.html'">🧠 Live Quiz</button>
    <br><br>
    <button onclick="location.href='/swalath.html'">📿 Swalath Counter</button>
    <br><br>
    <button class="secondary" onclick="logout()">Log Out</button>
  </div>
  <div class="card">
    <h2>Quiz Leaderboard</h2>
    <p class="small">Rankings are updated after each live question is completed.</p>
    <div id="leaderboard"></div>
  </div>
</div>
<footer class="site-footer"><span class="skssf-label">SKSSF</span>Cheeral Unit Committee</footer>

<div class="help-contact small center" style="margin-top:8px;">
  <a href="https://wa.me/+918606490401" target="_blank" rel="noopener">Contact for help: WhatsApp</a>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const user = JSON.parse(localStorage.getItem('quiz_user') || 'null');
if (!user) window.location.href = '/index.html';
else document.getElementById('welcome').textContent = 'Welcome, ' + user.name + '!';

function logout() {
  localStorage.removeItem('quiz_user');
  window.location.href = '/index.html';
}

function renderLeaderboard(list) {
  const el = document.getElementById('leaderboard');
  if (!list.length) { el.innerHTML = '<p class="small">No completed quiz scores yet.</p>'; return; }
  el.innerHTML = list.map(r => `
    <div class="leaderboard-row">
      <span>#${r.rank} ${r.name}</span>
      <span>${r.score} pts</span>
    </div>
  `).join('');
}

function updateLiveQuizBadge(isLive) {
  const btn = document.getElementById('liveQuizBtn');
  if (!btn) return;
  btn.innerHTML = isLive ? '🧠 Live Quiz <span class="badge active">●LIVE</span>' : '🧠 Live Quiz';
}

fetch('/api/quiz/current').then(r => r.json()).then(d => {
  updateLiveQuizBadge(!!d.live);
});

fetch('/api/leaderboard').then(r => r.json()).then(d => renderLeaderboard(d.leaderboard));
io().on('leaderboard-update', renderLeaderboard);
io().on('question-live', () => updateLiveQuizBadge(true));
io().on('question-ended', () => updateLiveQuizBadge(false));
</script>
</body>
</html>
